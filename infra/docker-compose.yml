services:
  postgres:
    image: postgres:16-alpine
    container_name: transo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transo_sales_bot}
      POSTGRES_USER: ${POSTGRES_USER:-transo_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting PostgreSQL.}
    ports:
      - "5432:5432"
    volumes:
      - transo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transo-postgres-data:
